name: Publish image

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-master
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/oliviaprel/fenshi-order-scheduling-mvp

jobs:
  publish:
    name: Publish scanned and attested image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build local image for security gates
        id: build_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: |
            ghcr.io/oliviaprel/fenshi-order-scheduling-mvp:sha-${{ github.sha }}
            ghcr.io/oliviaprel/fenshi-order-scheduling-mvp:latest
      - name: Generate downloadable SPDX JSON SBOM
        id: generate_sbom
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: fenshi-image.spdx.json
          artifact-name: fenshi-image-${{ github.sha }}.spdx.json
      - name: Record complete High and Critical inventory
        id: vulnerability_inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: json
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          output: trivy-high-critical.json
      - name: Upload complete vulnerability inventory
        id: upload_inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fenshi-image-vulnerabilities-${{ github.sha }}
          path: trivy-high-critical.json
          if-no-files-found: error
      - name: Fail on fixable High and Critical vulnerabilities
        id: vulnerability_gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
      - name: Generate production Caddy SPDX JSON SBOM
        id: caddy_sbom
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          format: spdx-json
          output-file: caddy-image.spdx.json
          artifact-name: caddy-image-${{ github.sha }}.spdx.json
      - name: Record complete production Caddy High and Critical inventory
        id: caddy_inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          format: json
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          output: caddy-trivy-high-critical.json
      - name: Upload complete production Caddy vulnerability inventory
        id: caddy_upload_inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caddy-image-vulnerabilities-${{ github.sha }}
          path: caddy-trivy-high-critical.json
          if-no-files-found: error
      - name: Fail on fixable production Caddy High and Critical vulnerabilities
        id: caddy_gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
      - name: Log in to GHCR
        id: registry_login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image
        id: push
        shell: bash
        run: |
          set -Eeuo pipefail
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"
          image_digest="$(docker buildx imagetools inspect \
            --format '{{.Manifest.Digest}}' \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}")"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Registry returned an invalid image digest" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"
      - name: Attest published image provenance
        id: attest_provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image reference
        id: record_image_reference
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published ${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
