name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, container smoke and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fenshi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fenshi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install_dependencies
        run: npm ci
      - name: Validate workflow security invariants
        id: validate_workflows
        run: npm run test:workflows
      - name: Verify fresh split-role database bootstrap
        id: database_role_smoke
        run: npm run test:database-roles
        env:
          POSTGRES_PORT: '55432'
      - run: npm run prisma:generate
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fenshi_test
        id: prisma_generate
      - id: lint
        run: npm run lint
      - id: typecheck
        run: npm run typecheck
      - run: npm run prisma:validate
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fenshi_test
        id: prisma_validate
      - run: npx prisma migrate deploy
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fenshi_test
        id: migrate
      - id: unit_tests
        run: npm run test:unit
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fenshi_test
      - id: integration_tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fenshi_test
      - id: install_playwright
        run: npx playwright install --with-deps chromium
      - id: e2e_tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fenshi_test
          APP_ORIGIN: http://127.0.0.1:3000
          # Public fixtures for the disposable fenshi_test database; never use in production.
          E2E_ADMIN_PHONE: '13900139000'
          E2E_ADMIN_PASSWORD: CI-only-admin-pass-2026!
          E2E_USER_PHONE: '13800138000'
          E2E_USER_PASSWORD: CI-only-user-temp-pass-2026!
          E2E_NEW_PASSWORD: CI-only-user-new-pass-2026!
          E2E_INVALID_PASSWORD: CI-only-wrong-pass-2026!
      - id: production_build
        run: npm run build
        env:
          APP_ORIGIN: http://127.0.0.1:3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fenshi_test
      - id: production_audit
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build local container image
        id: build_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/oliviaprel/fenshi-order-scheduling-mvp:ci-${{ github.sha }}
      - name: Smoke test the running container
        id: container_smoke
        shell: bash
        env:
          IMAGE_REF: ghcr.io/oliviaprel/fenshi-order-scheduling-mvp:ci-${{ github.sha }}
        run: |
          set -Eeuo pipefail
          trap 'docker rm --force fenshi-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name fenshi-ci --network host \
            --env APP_ORIGIN=http://127.0.0.1:3000 \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/fenshi_test \
            "$IMAGE_REF"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live
              exit 0
            fi
            echo "Waiting for container readiness (${attempt}/30)"
            sleep 2
          done
          docker logs fenshi-ci
          exit 1
      - name: Generate SPDX JSON SBOM
        id: generate_sbom
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: ghcr.io/oliviaprel/fenshi-order-scheduling-mvp:ci-${{ github.sha }}
          format: spdx-json
          output-file: fenshi-ci.spdx.json
          artifact-name: fenshi-ci-sbom.spdx.json
      - name: Record complete High and Critical inventory
        id: vulnerability_inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/oliviaprel/fenshi-order-scheduling-mvp:ci-${{ github.sha }}
          format: json
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          output: trivy-high-critical.json
      - name: Upload complete vulnerability inventory
        id: upload_inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fenshi-ci-vulnerabilities-${{ github.sha }}
          path: trivy-high-critical.json
          if-no-files-found: error
      - name: Fail on fixable High and Critical vulnerabilities
        id: vulnerability_gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/oliviaprel/fenshi-order-scheduling-mvp:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
      - name: Generate production Caddy SPDX JSON SBOM
        id: caddy_sbom
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          format: spdx-json
          output-file: caddy-ci.spdx.json
          artifact-name: caddy-ci-sbom.spdx.json
      - name: Record complete production Caddy High and Critical inventory
        id: caddy_inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          format: json
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          output: caddy-trivy-high-critical.json
      - name: Upload complete production Caddy vulnerability inventory
        id: caddy_upload_inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caddy-ci-vulnerabilities-${{ github.sha }}
          path: caddy-trivy-high-critical.json
          if-no-files-found: error
      - name: Fail on fixable production Caddy High and Critical vulnerabilities
        id: caddy_gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
